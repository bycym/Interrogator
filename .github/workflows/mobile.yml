name: Mobile build CI for Interrogator

on:
  push:     
    branches:
      - main
  pull_request: 
    types: [opened, synchronize, reopened, closed]
    
env:
  BUILD_TYPE: Release

jobs:
  android-build:
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QT_VERSION: '5.15.2'
      ANDROID_API_LEVEL: '30'
      ANDROID_BUILD_TOOLS_VERSION: '30.0.3'
      ANDROID_NDK_VERSION: '21.4.7075529'
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install aqt
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install aqtinstall==3.1.*

      - name: Install Qt for Android
        run: |
          # First, check what architectures are available
          python3 -m aqt list-qt linux android 5.15.2 || echo "Failed to list architectures"
          
          # Install Qt for Android with correct architecture
          python3 -m aqt install-qt linux android 5.15.2 android_arm64_v8a \
            --outputdir ${{github.workspace}}/qt/
          
          # Also install common Android packages if they exist
          python3 -m aqt install-qt linux android 5.15.2 android_arm64_v8a \
            --outputdir ${{github.workspace}}/qt/ \
            --archives qtbase qtdeclarative qttools || echo "Some archives not available"

      - name: Install Qt Desktop (needed for qmake)
        run: |
          # Install Qt for desktop
          python3 -m aqt install-qt linux desktop 5.15.2 \
            --outputdir ${{github.workspace}}/qt/

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Find Qt installation
          QT_DIR=$(find ${{github.workspace}}/qt -name "5.15.2" -type d | head -1)
          echo "QT_DIR: $QT_DIR"
          
          # Find Qt Android installation
          QT_ANDROID_DIR=$(find ${{github.workspace}}/qt -path "*/android*" -name "5.15.2" -type d | head -1)
          echo "QT_ANDROID_DIR: $QT_ANDROID_DIR"
          
          # Set Qt paths for subsequent steps
          echo "Qt5_Dir=$QT_DIR" >> $GITHUB_ENV
          echo "Qt5_Android_Dir=$QT_ANDROID_DIR" >> $GITHUB_ENV
          
          # Check if required tools exist
          which make || echo "make not found"
          ls -la $ANDROID_HOME/platforms/ || echo "No Android platforms found"
          ls -la $ANDROID_NDK_HOME/ || echo "NDK not found"
          
          # Check Qt installation
          if [ -n "$QT_DIR" ]; then
            ls -la "$QT_DIR/bin/" || echo "Qt bin directory not found"
            [ -f "$QT_DIR/bin/qmake" ] && echo "qmake found at $QT_DIR/bin/qmake" || echo "qmake not found"
          fi

      - name: Configure project for Android
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH="$Qt5_Dir/bin:$PATH"
          
          echo "Using Qt at: $Qt5_Dir"
          echo "Using Qt Android at: $Qt5_Android_Dir"
          
          # Generate Makefile for Android
          "$Qt5_Dir/bin/qmake" -spec android-clang \
                CONFIG+=release \
                ANDROID_ABIS=arm64-v8a \
                Interrogator.pro
          
      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export PATH="$Qt5_Dir/bin:$PATH"
          
          # Build the Android project
          make -j$(nproc)
          
          # Package APK using androiddeployqt
          if [ -f "$Qt5_Dir/bin/androiddeployqt" ]; then
            "$Qt5_Dir/bin/androiddeployqt" \
              --input android-Interrogator-deployment-settings.json \
              --output android-build \
              --android-platform android-${{ env.ANDROID_API_LEVEL }} \
              --jdk $JAVA_HOME \
              --gradle \
              --release
          else
            echo "androiddeployqt not found at $Qt5_Dir/bin/androiddeployqt"
            echo "Trying alternative locations..."
            find ${{github.workspace}}/qt -name "androiddeployqt" -type f
            echo "Available make targets:"
            make help || echo "No help available"
            make apk || make aab || echo "No APK/AAB build target found"
          fi
          
      - name: Find and copy APK
        run: |
          # Look for generated APK files
          echo "Searching for APK files..."
          find . -name "*.apk" -type f
          
          # Copy APK to standard location
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" AndroidInterrogator.apk
            echo "Found APK: $APK_FILE"
            ls -la AndroidInterrogator.apk
          else
            echo "No APK found, checking for AAB files..."
            find . -name "*.aab" -type f
            
            # If AAB exists, we'd need bundletool to convert to APK
            AAB_FILE=$(find . -name "*.aab" -type f | head -1)
            if [ -n "$AAB_FILE" ]; then
              echo "Found AAB: $AAB_FILE"
              # For now, just copy the AAB as the output
              cp "$AAB_FILE" AndroidInterrogator.aab
            fi
          fi
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AndroidInterrogator-Build
          path: |
            AndroidInterrogator.apk
            AndroidInterrogator.aab
            android-build/build/outputs/**/*
          if-no-files-found: warn

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-Build-Logs
          path: |
            android-build/build/outputs/logs/
            *.log
          if-no-files-found: ignore
          
